<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D2RHub Spatial Tiles Direction</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f5f6;
      --panel: rgba(255,255,255,.76);
      --panel-2: rgba(255,255,255,.56);
      --ink: #17181a;
      --ink-2: rgba(23,24,26,.66);
      --ink-3: rgba(23,24,26,.43);
      --hair: rgba(0,0,0,.055);
      --hair-2: rgba(0,0,0,.10);
      --black: #19191b;
      --green: #47795b;
      --blue: #4b7085;
      --red: #d84d45;
      --ease: cubic-bezier(.16, 1, .3, 1);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255,255,255,.48), rgba(255,255,255,0) 36%),
        #e8eaed;
      letter-spacing: 0;
    }

    .frame {
      width: min(980px, 100%);
      display: grid;
      gap: 10px;
    }

    .note {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0 4px;
      color: var(--ink-3);
      font-size: 11px;
      font-weight: 650;
    }

    .note strong {
      color: var(--ink);
      font-size: 12px;
      text-transform: uppercase;
    }

    .window {
      height: 680px;
      overflow: hidden;
      position: relative;
      border-radius: 22px;
      border: 1px solid var(--hair);
      background: var(--bg);
      box-shadow: 0 34px 86px rgba(31,36,44,.13), 0 1px 2px rgba(0,0,0,.04);
    }

    .window::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,0) 34%),
        radial-gradient(circle at 16% 0%, rgba(0,0,0,.034), transparent 30%);
    }

    .topbar {
      position: relative;
      z-index: 1;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border-bottom: 1px solid var(--hair);
      background: rgba(250,251,252,.72);
      backdrop-filter: blur(24px) saturate(1.08);
    }

    .mark {
      width: 26px;
      height: 26px;
      border-radius: 10px;
      border: 1px solid var(--hair);
      background: linear-gradient(145deg, #fff, #eceff2);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
    }

    .brand {
      font-size: 11px;
      font-weight: 760;
      color: var(--ink-2);
    }

    .spacer { flex: 1; }

    button, label {
      font-family: inherit;
    }

    .icon-btn,
    .button,
    .tool,
    .preset,
    .mini-action {
      transition: background .22s var(--ease), color .22s var(--ease), border-color .22s var(--ease), transform .18s var(--ease), opacity .22s var(--ease), box-shadow .22s var(--ease);
    }

    .icon-btn:active,
    .button:active,
    .tool:active,
    .preset:active,
    .mini-action:active {
      transform: scale(.97);
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--ink-3);
      font-size: 13px;
    }

    .icon-btn:hover {
      color: var(--ink);
      background: rgba(24,25,27,.04);
    }

    .actions {
      position: relative;
      z-index: 1;
      height: 54px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 18px;
    }

    .button {
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--hair);
      background: rgba(255,255,255,.48);
      color: var(--ink-2);
      font-size: 11px;
      font-weight: 760;
      white-space: nowrap;
    }

    .button.primary {
      color: #fff;
      background: var(--black);
      border-color: rgba(0,0,0,.16);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 10px 22px rgba(0,0,0,.08);
    }

    .button.danger {
      color: var(--red);
      background: rgba(255,59,48,.09);
      border-color: rgba(255,59,48,.11);
    }

    .tile-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 0 18px 18px;
    }

    .toggle {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .account-tile {
      min-height: 172px;
      border-radius: 22px;
      border: 1px solid var(--hair);
      background:
        linear-gradient(180deg, rgba(255,255,255,.84), rgba(255,255,255,.58));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.84);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .26s var(--ease), border-color .26s var(--ease), box-shadow .26s var(--ease), background .26s var(--ease);
    }

    .account-tile:hover {
      transform: translateY(-1px);
      border-color: var(--hair-2);
      background: linear-gradient(180deg, rgba(255,255,255,.93), rgba(255,255,255,.66));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 18px 42px rgba(24,29,36,.05);
    }

    .toggle:checked + .account-tile {
      grid-column: span 3;
      min-height: 250px;
      border-color: rgba(0,0,0,.09);
      background:
        linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,255,255,.70));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.88), 0 22px 52px rgba(24,29,36,.065);
    }

    .tile-core {
      flex: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      padding: 15px;
      min-width: 0;
    }

    .tile-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }

    .index {
      color: var(--ink-3);
      font-size: 10px;
      font-weight: 760;
      line-height: 1;
      margin-bottom: 8px;
    }

    .name-row,
    .tag-row,
    .bottom-row,
    .tools,
    .mod-row {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .name {
      color: var(--ink);
      font-size: 20px;
      font-weight: 780;
      line-height: .98;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .state {
      width: 10px;
      height: 10px;
      margin-top: 1px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(71,120,90,.10);
    }

    .state.warn {
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(216,77,69,.10);
    }

    .tag-row {
      margin-top: 11px;
    }

    .mod-row {
      align-self: end;
    }

    .badge {
      height: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      border-radius: 5px;
      border: 1px solid rgba(0,0,0,.018);
      background: rgba(24,25,27,.046);
      color: rgba(24,25,27,.58);
      font-size: 9px;
      font-weight: 820;
      line-height: 1;
    }

    .badge.blue { color: var(--blue); background: rgba(74,113,134,.105); }
    .badge.green { color: var(--green); background: rgba(71,120,90,.105); }
    .badge.red { color: var(--red); background: rgba(216,77,69,.11); }

    .mod {
      max-width: 96px;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .mod-add {
      width: 18px;
      padding: 0;
      font-size: 11px;
    }

    .bottom-row {
      justify-content: space-between;
      gap: 10px;
    }

    .mini-action {
      width: 34px;
      height: 30px;
      border-radius: 10px;
      border: 1px solid var(--hair);
      background: rgba(255,255,255,.42);
      color: var(--ink-3);
      font-size: 9px;
      font-weight: 820;
    }

    .tools {
      opacity: .16;
      transform: translateY(2px);
      transition: opacity .26s var(--ease), transform .26s var(--ease);
    }

    .account-tile:hover .tools,
    .account-tile:focus-within .tools,
    .toggle:checked + .account-tile .tools {
      opacity: 1;
      transform: translateY(0);
    }

    .config-label {
      width: 42px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid var(--hair);
      background: rgba(255,255,255,.42);
      color: var(--ink-3);
      font-size: 9px;
      font-weight: 820;
      cursor: pointer;
      user-select: none;
    }

    .config-label::after { content: "展开"; }
    .toggle:checked + .account-tile .config-label::after { content: "收起"; }

    .drawer {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transform: translateY(-4px);
      transition: grid-template-rows .36s var(--ease), opacity .22s ease, transform .36s var(--ease);
    }

    .toggle:checked + .account-tile .drawer {
      grid-template-rows: 1fr;
      opacity: 1;
      transform: translateY(0);
    }

    .drawer-inner {
      overflow: hidden;
      min-height: 0;
    }

    .drawer-body {
      margin: 0 15px 14px;
      padding-top: 13px;
      border-top: 1px solid var(--hair);
    }

    .drawer-grid {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) 152px minmax(148px, .9fr) 210px;
      gap: 10px;
      align-items: end;
    }

    .field {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .label {
      color: var(--ink-3);
      font-size: 9px;
      font-weight: 760;
      line-height: 1;
    }

    .input,
    .select {
      width: 100%;
      height: 27px;
      border: 1px solid var(--hair);
      border-radius: 8px;
      background: rgba(255,255,255,.48);
      color: var(--ink);
      padding: 0 9px;
      font-size: 10px;
      font-weight: 650;
      outline: 0;
    }

    .seg {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .preset {
      height: 27px;
      border: 1px solid var(--hair);
      border-radius: 8px;
      background: rgba(255,255,255,.38);
      color: var(--ink-2);
      font-size: 10px;
      font-weight: 800;
    }

    .preset.active {
      color: var(--ink);
      background: rgba(24,25,27,.07);
      border-color: var(--hair-2);
    }

    .control-line,
    .combo-field {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .combo-field {
      gap: 0;
      height: 27px;
      border: 1px solid var(--hair);
      border-radius: 8px;
      background: rgba(255,255,255,.48);
      overflow: hidden;
    }

    .combo-field .select,
    .combo-field .input {
      height: 100%;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .combo-field .select {
      flex: 1;
      min-width: 0;
    }

    .combo-field .input {
      width: 64px;
      border-left: 1px solid var(--hair);
      text-align: center;
    }

    .control-line .input {
      flex: 1;
      min-width: 0;
      text-align: center;
    }

    .progress {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 3px;
      margin: 0 15px 14px;
    }

    .step {
      height: 3px;
      border-radius: 999px;
      background: rgba(24,25,27,.08);
    }

    .step.done { background: rgba(71,120,90,.68); }
    .step.live { background: var(--black); }

    @media (max-width: 860px) {
      body { padding: 14px; }
      .window { height: auto; min-height: 680px; }
      .actions { height: auto; padding: 12px 18px; flex-wrap: wrap; }
      .tile-grid { grid-template-columns: 1fr; }
      .toggle:checked + .account-tile { grid-column: span 1; }
      .drawer-grid { grid-template-columns: 1fr; }
      .tools { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="note">
      <strong>Spatial Tiles / Expanded</strong>
      <span>three square-ish cards, one expanded control tile</span>
    </div>

    <section class="window">
      <div class="topbar">
        <div class="mark"></div>
        <div class="brand">D2RHub</div>
        <div class="spacer"></div>
        <button class="icon-btn" title="设置">⌘</button>
        <button class="icon-btn" title="统计">◷</button>
        <button class="icon-btn" title="最小化">−</button>
      </div>

      <div class="actions">
        <button class="button primary">启动全部 4</button>
        <button class="button">选择账号</button>
        <div class="spacer"></div>
        <button class="button danger">一键关闭</button>
        <button class="button">添加账号</button>
      </div>

      <div class="tile-grid">
        <input class="toggle" id="account-a" type="checkbox" checked />
        <article class="account-tile">
          <div class="tile-core">
            <div class="tile-top">
              <div>
                <div class="index">01 / READY</div>
                <div class="name-row">
                  <div class="name">山鬼</div>
                </div>
                <div class="tag-row">
                  <span class="badge">刚刚</span>
                  <span class="badge">国服</span>
                  <span class="badge blue">战网认证</span>
                  <span class="badge green">28d</span>
                </div>
              </div>
              <div class="state"></div>
            </div>
            <div class="mod-row">
              <span class="badge mod">-mod hd</span>
              <span class="badge mod">-mod loot</span>
              <span class="badge mod-add">+</span>
            </div>
            <div class="bottom-row">
              <button class="button primary">启动</button>
              <div class="tools">
                <button class="mini-action">B</button>
                <label class="config-label" for="account-a"></label>
                <button class="mini-action">F</button>
                <button class="mini-action">R</button>
              </div>
            </div>
          </div>

          <div class="drawer">
            <div class="drawer-inner">
              <div class="drawer-body">
                <div class="drawer-grid">
                  <div class="field">
                    <div class="label">分辨率</div>
                    <select class="select"><option>1280x720</option><option>1600x900</option><option>1920x1080</option></select>
                  </div>
                  <div class="field">
                    <div class="label">预设</div>
                    <div class="seg"><button class="preset">低</button><button class="preset active">中</button><button class="preset">高</button></div>
                  </div>
                  <div class="field">
                    <div class="label">FPS</div>
                    <div class="combo-field"><select class="select"><option>60</option><option>120</option><option>无限制</option></select><input class="input" value="60" /></div>
                  </div>
                  <div class="field">
                    <div class="label">坐标</div>
                    <div class="control-line"><input class="input" value="0" /><input class="input" value="0" /><button class="button">复位</button></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="progress">
            <div class="step done"></div><div class="step done"></div><div class="step done"></div><div class="step live"></div>
            <div class="step"></div><div class="step"></div><div class="step"></div><div class="step"></div>
          </div>
        </article>

        <input class="toggle" id="account-b" type="checkbox" />
        <article class="account-tile">
          <div class="tile-core">
            <div class="tile-top">
              <div>
                <div class="index">02 / READY</div>
                <div class="name-row"><div class="name">尹枫澜</div></div>
                <div class="tag-row"><span class="badge">3 小时前</span><span class="badge">亚服</span><span class="badge blue">战网认证</span><span class="badge green">28d</span></div>
              </div>
              <div class="state"></div>
            </div>
            <div class="mod-row"><span class="badge mod">-mod loot</span><span class="badge mod-add">+</span></div>
            <div class="bottom-row">
              <button class="button primary">启动</button>
              <div class="tools"><button class="mini-action">B</button><label class="config-label" for="account-b"></label><button class="mini-action">F</button><button class="mini-action">R</button></div>
            </div>
          </div>
          <div class="drawer"><div class="drawer-inner"><div class="drawer-body"><div class="drawer-grid">
            <div class="field"><div class="label">分辨率</div><select class="select"><option>1600x900</option></select></div>
            <div class="field"><div class="label">预设</div><div class="seg"><button class="preset active">低</button><button class="preset">中</button><button class="preset">高</button></div></div>
            <div class="field"><div class="label">FPS</div><div class="combo-field"><select class="select"><option>30</option></select><input class="input" value="30" /></div></div>
            <div class="field"><div class="label">坐标</div><div class="control-line"><input class="input" value="960" /><input class="input" value="0" /><button class="button">复位</button></div></div>
          </div></div></div></div>
        </article>

        <input class="toggle" id="account-c" type="checkbox" />
        <article class="account-tile">
          <div class="tile-core">
            <div class="tile-top">
              <div>
                <div class="index">03 / ATTENTION</div>
                <div class="name-row"><div class="name">Eld</div></div>
                <div class="tag-row"><span class="badge">7 天前</span><span class="badge">美服</span><span class="badge blue">战网认证</span><span class="badge red">过期</span></div>
              </div>
              <div class="state warn"></div>
            </div>
            <div class="mod-row"><span class="badge">待重置</span><span class="badge mod-add">+</span></div>
            <div class="bottom-row">
              <button class="button danger">重置</button>
              <div class="tools"><label class="config-label" for="account-c"></label><button class="mini-action">×</button></div>
            </div>
          </div>
          <div class="drawer"><div class="drawer-inner"><div class="drawer-body"><div class="tag-row"><span class="badge red">Token 已过期</span><span class="badge">重新初始化后可启动</span></div></div></div></div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
